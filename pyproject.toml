[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# LeRobot's register_third_party_plugins() imports the distribution name
# VERBATIM as a module, so it must match the package directory exactly.
# A hyphen here would silently break discovery.
name = "lerobot_robot_kikobot"
version = "0.1.0"
description = "Kiko-Bot 6-DOF arm for LeRobot: a MuJoCo sim server, the real Feetech arm and 6-DOF gamepad IK teleop"
readme = "README.md"
requires-python = ">=3.12"
# lerobot is installed from source first (see README), so it is not pinned here.
dependencies = [
    "lerobot",
    "mujoco>=3.15",
    "numpy>=2",
    "glfw>=2.9",
    "feetech-servo-sdk>=1.0",
    "pyzmq>=26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The Newton engine and MuJoCo Warp's ray-traced renderer for kikobot-sim-server
# (NVIDIA GPU; on a machine without CUDA, Newton falls back to MuJoCo's C solver).
newton = ["newton[sim,importers]>=1.7", "warp-lang>=1.17", "trimesh"]

[project.scripts]
kikobot-sim-server = "lerobot_robot_kikobot.sim_server:main"

[tool.setuptools.packages.find]
include = ["lerobot_robot_kikobot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
